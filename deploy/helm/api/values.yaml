image:
  repository: api   # registry path of the image, e.g. registry.example.com/team/api
  tag: ""                 # empty: appVersion from Chart.yaml
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Names of existing Kubernetes Secrets; each of their keys becomes an environment variable.
# Where several Secrets set the same key, the last one wins. The chart never contains secret values:
#   kubectl create secret generic project-env --from-env-file=env_files/project.env  (once, for all services)
#   kubectl create secret generic api-env --from-env-file=env_files/api.env
existingSecrets: []

# Settings that aren't secret, as environment variables (fields of Config).
env:
  LOG_HANDLERS: '["json"]'

replicaCount: 1

service:
  port: 8000                       # the port fastapi run listens on (CMD in the Dockerfile)

ingress:
  enabled: false                   # true: reachable from outside the cluster at host
  className: ""                    # the cluster's ingress class, such as nginx or traefik; empty: its default
  host: app.example.com
  tlsSecret: ""                    # name of an existing TLS Secret for host; empty: plain HTTP
  annotations: {}

resources:                         # what Kubernetes reserves for a pod, and the most it may use
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Folders from outside the image, such as data/ (see /docker-service): the pod's volumes and where they are mounted.
#   volumes: [{name: data, persistentVolumeClaim: {claimName: <release>-data}}]
#   volumeMounts: [{name: data, mountPath: /app/data}]
volumes: []
volumeMounts: []
