# Runs one service once in a container: docker compose run --rm <service>
services:
  api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:  # the same files the service reads locally; a later file wins
      - path: env_files/project.env
        required: false
      - path: env_files/api.env
        required: false
    environment:  # wins over env_file: containers log JSON to stdout, whatever the env files set for local runs
      LOG_HANDLERS: '["json"]'
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: app/project_core
        - action: rebuild
          path: app/api
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock
  order_worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/order_worker.Dockerfile
    env_file:  # the same files the service reads locally; a later file wins
      - path: env_files/project.env
        required: false
      - path: env_files/order_worker.env
        required: false
    environment:  # wins over env_file: containers log JSON to stdout, whatever the env files set for local runs
      LOG_HANDLERS: '["json"]'
  json:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/json.Dockerfile
    env_file:  # the same files the service reads locally; a later file wins
      - path: env_files/project.env
        required: false
      - path: env_files/json.env
        required: false
    environment:  # wins over env_file: containers log JSON to stdout, whatever the env files set for local runs
      LOG_HANDLERS: '["json"]'
